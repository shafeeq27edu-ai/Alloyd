name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine3.20
        env:
          POSTGRES_USER: alloyd
          POSTGRES_PASSWORD: alloyd_dev_password
          POSTGRES_DB: alloyd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alloyd -d alloyd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Create test database
        run: PGPASSWORD=alloyd_dev_password psql -h 127.0.0.1 -U alloyd -d alloyd -c "CREATE DATABASE alloyd_test"
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://alloyd:alloyd_dev_password@127.0.0.1:5432/alloyd_test
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
        run: npm run build

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      ENABLE_MOCK_PROVIDER: "true"
      POSTGRES_PORT: "5435"
      BACKEND_PORT: "8003"
      FRONTEND_PORT: "3003"
      ALLOWED_ORIGINS: http://app.lvh.me:3003
      COOKIE_DOMAIN: .lvh.me
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_API_BASE_URL: http://api.lvh.me:8003/api
    steps:
      - uses: actions/checkout@v4
      - name: Map sibling test hosts
        run: sudo sh -c 'echo "127.0.0.1 app.lvh.me api.lvh.me" >> /etc/hosts'
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the stack
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://api.lvh.me:8003/ready >/dev/null && curl -sf http://app.lvh.me:3003/ >/dev/null; then
              echo "stack ready after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready" >&2
          docker compose logs --no-color
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect stack logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose.log
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v
