# Local production-like stack: Postgres, migrations, API, and web.
# The defaults are development-only credentials. Override them through a
# root .env file (never committed) or your shell before any real use.
#
#   docker compose up --build
#   docker compose run --rm migrate
#
# Sibling subdomains locally need no hosts-file edit when using lvh.me:
#   ALLOWED_ORIGINS=http://app.lvh.me:3000
#   COOKIE_DOMAIN=.lvh.me
#   NEXT_PUBLIC_API_BASE_URL=http://api.lvh.me:8000/api

name: alloyd

x-backend-env: &backend-env
  PROJECT_NAME: ${PROJECT_NAME:-Alloyd}
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-alloyd}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-alloyd_dev_password}
  DB_NAME: ${POSTGRES_DB:-alloyd}
  SECRET_KEY: ${SECRET_KEY:-dev_only_secret_key_change_me_before_real_use}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-pKziX9YlYVhewTTQihP8wjBmbb4btXmT8g61yov1-yo=}
  DEBUG: ${DEBUG:-false}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1000000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
  STARTUP_DB_CHECK_RETRIES: ${STARTUP_DB_CHECK_RETRIES:-10}
  STARTUP_DB_CHECK_DELAY_SECONDS: ${STARTUP_DB_CHECK_DELAY_SECONDS:-2}
  DB_DISABLE_PREPARED_STATEMENTS: ${DB_DISABLE_PREPARED_STATEMENTS:-false}

services:
  db:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alloyd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alloyd_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-alloyd}
    volumes:
      - alloyd_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: alloyd-backend:local
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: alloyd-backend:local
    build:
      context: ./backend
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  alloyd_pgdata:
